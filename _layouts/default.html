<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

</head>
<body>

  <!-- ╔══════════════ HEADER / HERO ══════════════╗ -->
  <header class="site-header">

          View on GitHub
        </a>
        <a href="https://github.com/MiamiBeachBots/2026-bot/releases" class="btn btn-ghost" target="_blank" rel="noopener">Releases</a>
      </div>
    </div>
    <div class="header-decoration">
      <div class="deco-circle deco-1"></div>
      <div class="deco-circle deco-2"></div>
      <div class="deco-bar"></div>
    </div>
  </header>

  <!-- ╔══════════════ NAV BAR ══════════════╗ -->
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="#project-status">Status</a>
      <a href="#quick-start">Quick Start</a>
      <a href="#build--deploy">Build &amp; Deploy</a>
      <a href="#project-structure">Structure</a>
      <a href="#documentation">Docs</a>
      <a href="#can-bus-map">CAN Map</a>
      <a href="#roadmap--todo">Roadmap</a>
      <a href="#team--sponsors">Team</a>
    </div>
  </nav>

  <!-- ╔══════════════ MAIN CONTENT ══════════════╗ -->
  <main class="main-content">
    <article class="page-body">
      {{ content }}
    </article>
  </main>

  <!-- ╔══════════════ FOOTER ══════════════╗ -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-brand">Miami Beach Bots &mdash; FRC Team 2026 &bull; Miami Beach, FL</p>
      <p class="footer-sub">Built with ❤️ by student engineers &bull; <a href="https://github.com/MiamiBeachBots/2026-bot" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>

</html>
